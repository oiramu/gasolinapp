<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <title>Sin conexión — GasolinApp</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111318; color: #e5e7eb; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      .card { max-width: 340px; display: grid; gap: 14px; justify-items: center; }
      .logo { width: 64px; height: 64px; border-radius: 16px; background: #1a1e27; border: 2px solid rgba(0, 229, 160, 0.35); display: grid; place-items: center; }
      h1 { font-size: 22px; color: #fff; }
      p { font-size: 15px; line-height: 1.45; color: #9ca3af; }
      button { margin-top: 6px; height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #00e5a0; color: #111318; font-size: 15px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>
      </div>
      <h1>Sin conexión</h1>
      <p>Los precios se actualizan en vivo, así que GasolinApp necesita internet. Revisa tu conexión y vuelve a intentar.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
