<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GasolinApp Colombia — Precios de Corriente, Extra y Diésel</title>
    <meta
      name="description"
      content="Encuentra las gasolineras más baratas en Colombia. Consulta y reporta precios de gasolina corriente, extra y diésel actualizados por la comunidad en tiempo real."
    />
    <meta
      name="keywords"
      content="precios gasolina colombia, gasolineras baratas, gasolina corriente, extra, diésel, mapa gasolineras, combustible colombia"
    />
    <meta
      property="og:title"
      content="GasolinApp Colombia — Precios en tiempo real"
    />
    <meta
      property="og:description"
      content="Encuentra las gasolineras más baratas en Colombia. Consulta y reporta precios de gasolina actualizados por la comunidad."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gasolinapp.oiramu.com" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="GasolinApp" />
    <!-- 3.3: PNG de 1200×630 (WhatsApp no muestra SVG). Plantilla en scripts/og-image.html -->
    <meta property="og:image" content="https://gasolinapp.oiramu.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GasolinApp: ¿dónde tanquear más barato hoy? Precios de corriente, extra, diésel y gas confirmados por la comunidad." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GasolinApp Colombia — Precios en tiempo real" />
    <meta name="twitter:description" content="Encuentra las gasolineras más baratas en Colombia. Consulta y reporta precios de gasolina actualizados por la comunidad." />
    <meta name="twitter:image" content="https://gasolinapp.oiramu.com/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/fuel-icon.svg" />
    <!-- 4.2: instalable como PWA (manifest, color de la barra e ícono de iOS) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111318" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GasolinApp" />
    <!-- Velocidad: conexiones anticipadas a las teselas del mapa (el contenido principal) y a las fuentes -->
    <link rel="preconnect" href="https://services.arcgisonline.com" />
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Las fuentes no bloquean el primer pintado (display=swap): se aplican cuando llegan -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
      />
    </noscript>
    <!-- La CSS de Leaflet va en el bundle (src/main.jsx), ya no desde cdnjs -->
  </head>
  <body class="bg-surface text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
